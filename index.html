<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Buxgalter — hisob-kitob</title>
    <style>
        :root {
            --bg: #f2f4fb;
            --card: #fff;
            --tx: #161a2b;
            --mu: #6b7390;
            --pr: #5b4bff;
            --pr2: #8a5bff;
            --ok: #0f9d68;
            --bad: #e5484d;
            --bd: #e3e7f3;
            --in: #f6f7fc;
            --sh: 0 8px 28px rgba(40, 50, 110, .09);
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        @media(prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --bg: #0d0f1e;
                --card: #171a2e;
                --tx: #eef0fb;
                --mu: #8e95b5;
                --bd: #262a45;
                --in: #0f1124;
                --sh: 0 8px 28px rgba(0, 0, 0, .4);
                --ok: #2ed39a;
                --bad: #ff6b70
            }
        }

        :root[data-theme="dark"] {
            --bg: #0d0f1e;
            --card: #171a2e;
            --tx: #eef0fb;
            --mu: #8e95b5;
            --bd: #262a45;
            --in: #0f1124;
            --sh: 0 8px 28px rgba(0, 0, 0, .4);
            --ok: #2ed39a;
            --bad: #ff6b70
        }

        * {
            box-sizing: border-box
        }

        html,
        body {
            height: 100%;
            margin: 0
        }

        body {
            background: var(--bg);
            color: var(--tx);
            font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0 0 auto;
            height: env(safe-area-inset-top, 0px);
            background: var(--bg);
            z-index: 10
        }

        #app {
            max-width: 680px;
            margin: 0 auto;
            min-height: 100%;
            padding-bottom: 84px
        }

        header {
            position: sticky;
            top: env(safe-area-inset-top, 0px);
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            background: var(--bg)
        }

        h1 {
            font-size: 22px;
            margin: 0;
            font-weight: 800;
            letter-spacing: -.3px
        }

        h3 {
            margin: 0 0 12px;
            font-size: 16px
        }

        header div {
            display: flex;
            gap: 8px;
            align-items: center
        }

        .ib,
        .av {
            width: 40px;
            height: 40px;
            border-radius: 14px;
            border: 1px solid var(--bd);
            background: var(--card);
            font-size: 18px;
            cursor: pointer;
            box-shadow: var(--sh);
            color: var(--tx)
        }

        .av {
            background: linear-gradient(135deg, var(--pr), var(--pr2));
            color: #fff;
            font-weight: 700;
            border: 0
        }

        main {
            padding: 0 14px
        }

        .card {
            background: var(--card);
            border: 1px solid var(--bd);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 14px;
            box-shadow: var(--sh)
        }

        label {
            display: block;
            font-size: 12px;
            color: var(--mu);
            font-weight: 600;
            margin-bottom: 10px
        }

        input,
        select {
            width: 100%;
            margin-top: 5px;
            padding: 12px 13px;
            border-radius: 12px;
            border: 1px solid var(--bd);
            background: var(--in);
            color: var(--tx);
            font: inherit;
            font-size: 16px;
            outline: 0
        }

        input:focus,
        select:focus {
            border-color: var(--pr);
            box-shadow: 0 0 0 3px rgba(91, 75, 255, .18)
        }

        .btn {
            width: 100%;
            padding: 13px;
            border: 0;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--pr), var(--pr2));
            color: #fff;
            font: inherit;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(91, 75, 255, .35)
        }

        .btn.sec {
            background: var(--in);
            color: var(--tx);
            box-shadow: none;
            border: 1px solid var(--bd)
        }

        .btn.red {
            background: var(--bad);
            box-shadow: none
        }

        .pv {
            display: flex;
            justify-content: space-between;
            margin: 2px 0 12px;
            color: var(--mu)
        }

        .pv b {
            color: var(--tx)
        }

        .msg {
            color: var(--bad);
            font-size: 13px;
            min-height: 18px;
            margin: 0 0 6px
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 11px 0;
            border-bottom: 1px dashed var(--bd)
        }

        .row small {
            display: block;
            color: var(--mu);
            font-size: 12px
        }

        .amt {
            font-weight: 700;
            display: flex;
            gap: 8px;
            align-items: center;
            white-space: nowrap
        }

        .ok {
            color: var(--ok)
        }

        .bad {
            color: var(--bad)
        }

        .x {
            border: 0;
            background: var(--in);
            color: var(--mu);
            width: 28px;
            height: 28px;
            border-radius: 9px;
            cursor: pointer
        }

        .mu {
            color: var(--mu);
            text-align: center;
            margin: 8px 0
        }

        .total {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            padding: 14px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--pr), var(--pr2));
            color: #fff;
            font-size: 15px
        }

        .total b {
            font-size: 18px
        }

        nav {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 6;
            display: flex;
            justify-content: center;
            padding: 8px 10px calc(8px + env(safe-area-inset-bottom, 0px));
            background: var(--card);
            border-top: 1px solid var(--bd)
        }

        nav>div {
            display: flex;
            width: 100%;
            max-width: 680px;
            gap: 4px
        }

        nav button {
            flex: 1;
            border: 0;
            background: none;
            color: var(--mu);
            font: inherit;
            font-size: 11px;
            font-weight: 600;
            padding: 6px 2px;
            border-radius: 12px;
            cursor: pointer
        }

        nav button span {
            display: block;
            font-size: 20px
        }

        nav button.on {
            color: var(--pr);
            background: rgba(91, 75, 255, .12)
        }

        .seg {
            display: flex;
            background: var(--in);
            border-radius: 14px;
            padding: 4px;
            margin-bottom: 12px;
            border: 1px solid var(--bd)
        }

        .seg button {
            flex: 1;
            border: 0;
            background: none;
            padding: 10px;
            border-radius: 11px;
            font: inherit;
            font-weight: 700;
            color: var(--mu);
            cursor: pointer
        }

        .seg button.on {
            background: var(--card);
            color: var(--pr);
            box-shadow: var(--sh)
        }

        .kp {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 14px
        }

        .k {
            border-radius: 18px;
            padding: 14px;
            color: #fff
        }

        .k small {
            opacity: .85;
            display: block
        }

        .k b {
            font-size: 19px
        }

        .k1 {
            background: linear-gradient(135deg, #0f9d68, #35c48e)
        }

        .k2 {
            background: linear-gradient(135deg, #e5484d, #ff7a7e)
        }

        .k3 {
            grid-column: span 2;
            background: linear-gradient(135deg, var(--pr), var(--pr2))
        }

        .tw {
            overflow-x: auto
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            min-width: 320px
        }

        th,
        td {
            padding: 8px 6px;
            text-align: right;
            border-bottom: 1px solid var(--bd)
        }

        th:first-child,
        td:first-child {
            text-align: left
        }

        th {
            color: var(--mu);
            font-weight: 600
        }

        .login {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(160deg, var(--pr), var(--pr2) 60%, #c25bff)
        }

        .login .card {
            width: 100%;
            max-width: 400px;
            padding: 24px
        }

        .logo {
            font-size: 44px;
            text-align: center
        }

        .login h2 {
            text-align: center;
            margin: 4px 0 4px
        }

        .login p.s {
            text-align: center;
            color: var(--mu);
            margin: 0 0 16px;
            font-size: 13px
        }

        .ph {
            display: flex;
            align-items: center;
            gap: 8px
        }

        .ph span {
            margin-top: 5px;
            padding: 12px;
            border-radius: 12px;
            background: var(--in);
            border: 1px solid var(--bd);
            font-weight: 700
        }

        .prof {
            text-align: center
        }

        .prof .av {
            width: 76px;
            height: 76px;
            border-radius: 26px;
            font-size: 30px;
            margin-bottom: 8px;
            box-shadow: none
        }
    </style>
</head>

<body>
    <div id="app"></div>
    <script>
        const $ = s => document.querySelector(s);
        const ls = { get(k) { try { return localStorage.getItem(k) } catch (e) { return null } }, set(k, v) { try { localStorage.setItem(k, v) } catch (e) { } }, del(k) { try { localStorage.removeItem(k) } catch (e) { } } };
        const fmt = n => (Math.round((n || 0) * 100) / 100).toLocaleString('ru-RU').replace(/[\u00a0\u202f]/g, ' ');
        const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0') };
        const S = {
            purchases: { ic: '📥', add: `Olingan mahsulot qo'shish`, f: [['n', 'Mahsulot nomi', 'text'], ['q', 'Miqdori (kg)', 'number'], ['p', `1 kg narxi (so'm)`, 'number']], tot: r => r.q * r.p, sub: r => `${fmt(r.q)} kg × ${fmt(r.p)} so'm`, sum: 'Umumiy olingan summa', cls: () => 'bad' },
            sales: { ic: '📤', add: `Sotilgan mahsulot qo'shish`, f: [['n', 'Mahsulot nomi', 'text'], ['q', 'Miqdori (kg)', 'number'], ['p', `1 kg narxi (so'm)`, 'number']], tot: r => r.q * r.p, sub: r => `${fmt(r.q)} kg × ${fmt(r.p)} so'm`, sum: 'Umumiy sotilgan summa', cls: () => 'ok' },
            workers: { ic: '👷', add: `Ishchi qo'shish`, f: [['n', 'Ishchi ismi', 'text'], ['q', 'Kunlik ishlagan soat', 'number'], ['p', `1 soat uchun haq (so'm)`, 'number']], tot: r => r.q * r.p, sub: r => `${fmt(r.q)} soat × ${fmt(r.p)} so'm`, sum: 'Umumiy ish haqi', cls: () => 'bad' },
            extras: { ic: '➕', add: `Qo'shimcha summa qo'shish`, f: [['n', 'Izoh', 'text'], ['t', 'Turi', 'select'], ['a', `Summa (so'm)`, 'number']], opt: [['in', 'Kirim (daromad)'], ['out', 'Chiqim (xarajat)']], tot: r => r.a, sub: r => r.t === 'in' ? 'Kirim' : 'Chiqim', sum: `Qo'shimcha: sof natija`, cls: r => r.t === 'in' ? 'ok' : 'bad' }
        };
        const T = { purchases: 'Olingan mahsulot', sales: 'Sotilgan mahsulot', workers: 'Ishchilar', summary: 'Kirdi-chiqdi', extras: `Qo'shimcha summalar`, profile: 'Profil', settings: 'Sozlamalar' };
        const N = [['purchases', '📥', 'Olingan'], ['sales', '📤', 'Sotilgan'], ['workers', '👷', 'Ishchilar'], ['summary', '📊', 'Hisobot'], ['extras', '➕', `Qo'shimcha`]];
        let user = null, db = null, saveQueue = Promise.resolve(), view = 'purchases', lt = 'phone', authMode = 'login', wipe = false, notice = '', sm = { mode: 'd', day: today(), month: today().slice(0, 7) };
        const emptyDb = () => ({ purchases: [], sales: [], workers: [], extras: [] });
        const isStaticPages = location.hostname.endsWith('.github.io');
        const staticUsersKey = 'bug_pages_users';
        const staticSessionKey = 'bug_pages_session';
        function staticStorageGet(key) {
            try { return localStorage.getItem(key) }
            catch (e) { throw new Error('Brauzer xotirasini o‘qib bo‘lmadi. Maxfiy ko‘rish rejimini o‘chirib, qayta urinib ko‘ring.') }
        }
        function staticStorageSet(key, value) {
            try { localStorage.setItem(key, value) }
            catch (e) { throw new Error('Brauzer xotirasiga saqlab bo‘lmadi. Qurilmada bo‘sh joy borligini tekshiring.') }
        }
        function staticJsonGet(key, fallback) {
            const value = staticStorageGet(key);
            if (value === null) return fallback;
            try { return JSON.parse(value) }
            catch (e) { throw new Error('Brauzerda saqlangan ma’lumot formati buzilgan.') }
        }
        async function hashStaticPassword(password, salt) {
            if (!crypto.subtle) throw new Error('Parolli kirish uchun HTTPS orqali oching.');
            const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']);
            const bits = await crypto.subtle.deriveBits(
                { name: 'PBKDF2', salt, iterations: 150000, hash: 'SHA-256' },
                key,
                256
            );
            return Array.from(new Uint8Array(bits), byte => byte.toString(16).padStart(2, '0')).join('');
        }
        function staticIdentifier(method, value) {
            if (typeof value !== 'string') throw new Error('Telefon yoki Gmail manzilini kiriting.');
            if (method === 'phone') {
                let digits = value.replace(/\D/g, '');
                if (digits.startsWith('998') && digits.length === 12) digits = digits.slice(3);
                if (!/^\d{9}$/.test(digits)) throw new Error('Telefon raqam 9 ta raqamdan iborat bo‘lishi kerak.');
                return { id: `p998${digits}`, label: `+998 ${digits}` };
            }
            if (method === 'mail') {
                const email = value.trim().toLowerCase();
                if (!/^[^\s@]+@gmail\.com$/.test(email) || email.length > 254) throw new Error('To‘g‘ri Gmail manzilini kiriting.');
                return { id: `m${email}`, label: email };
            }
            throw new Error('Kirish usuli noto‘g‘ri.');
        }
        async function staticApi(url, options = {}) {
            const method = options.method || 'GET';
            const body = options.body ? JSON.parse(options.body) : {};
            if (url === '/api/session' && method === 'GET') {
                return { user: staticJsonGet(staticSessionKey, null) };
            }
            if (url === '/api/auth/register' && method === 'POST') {
                if (typeof body.password !== 'string' || body.password.length < 8 || body.password.length > 128) {
                    throw new Error('Parol kamida 8 ta belgidan iborat bo‘lishi kerak.');
                }
                if (typeof body.name !== 'string' || !body.name.trim() || body.name.trim().length > 80) {
                    throw new Error('Ismni kiriting (ko‘pi bilan 80 ta belgi).');
                }
                const { id, label } = staticIdentifier(body.method, body.value);
                const users = staticJsonGet(staticUsersKey, {});
                if (users[id]) throw new Error('Bu telefon yoki Gmail uchun brauzerda hisob mavjud. Kirish bo‘limidan kiring.');
                const salt = crypto.getRandomValues(new Uint8Array(16));
                const user = { id, label, name: body.name.trim() };
                users[id] = {
                    ...user,
                    salt: Array.from(salt, byte => byte.toString(16).padStart(2, '0')).join(''),
                    passwordHash: await hashStaticPassword(body.password, salt)
                };
                staticStorageSet(staticUsersKey, JSON.stringify(users));
                staticStorageSet(staticSessionKey, JSON.stringify(user));
                return { user };
            }
            if (url === '/api/auth/login' && method === 'POST') {
                if (typeof body.password !== 'string' || body.password.length > 128) throw new Error('Telefon/Gmail va parolni kiriting.');
                const { id } = staticIdentifier(body.method, body.value);
                const users = staticJsonGet(staticUsersKey, {});
                const account = users[id];
                if (!account || !account.salt || !account.passwordHash) throw new Error('Bu brauzerda hisob topilmadi. Avval ro‘yxatdan o‘ting.');
                const salt = new Uint8Array(account.salt.match(/.{2}/g).map(byte => parseInt(byte, 16)));
                if (await hashStaticPassword(body.password, salt) !== account.passwordHash) throw new Error('Telefon/Gmail yoki parol noto‘g‘ri.');
                const user = { id: account.id, label: account.label, name: account.name };
                staticStorageSet(staticSessionKey, JSON.stringify(user));
                return { user };
            }
            if (url === '/api/auth/logout' && method === 'POST') {
                try { localStorage.removeItem(staticSessionKey) }
                catch (e) { throw new Error('Hisobdan chiqishda brauzer xotirasiga ulanib bo‘lmadi.') }
                return null;
            }
            if (url === '/api/data' && method === 'GET') {
                const session = staticJsonGet(staticSessionKey, null);
                if (!session) throw new Error('Avval hisobingizga kiring.');
                return { data: staticJsonGet(`bug_pages_db_${session.id}`, emptyDb()) };
            }
            if (url === '/api/data' && method === 'PUT') {
                const session = staticJsonGet(staticSessionKey, null);
                if (!session) throw new Error('Avval hisobingizga kiring.');
                staticStorageSet(`bug_pages_db_${session.id}`, JSON.stringify(body.data));
                return { data: body.data };
            }
            if (url === '/api/profile' && method === 'PATCH') {
                const session = staticJsonGet(staticSessionKey, null);
                if (!session) throw new Error('Avval hisobingizga kiring.');
                if (typeof body.name !== 'string' || !body.name.trim() || body.name.trim().length > 80) throw new Error('Ismni kiriting.');
                const users = staticJsonGet(staticUsersKey, {});
                users[session.id].name = body.name.trim();
                const user = { id: users[session.id].id, label: users[session.id].label, name: users[session.id].name };
                staticStorageSet(staticUsersKey, JSON.stringify(users));
                staticStorageSet(staticSessionKey, JSON.stringify(user));
                return { user };
            }
            throw new Error('GitHub Pages uchun bu API amali mavjud emas.');
        }
        async function api(url, options = {}) {
            if (isStaticPages) return staticApi(url, options);
            let response;
            try {
                response = await fetch(url, {
                    credentials: 'same-origin',
                    ...options,
                    headers: { ...(options.body ? { 'Content-Type': 'application/json' } : {}), ...options.headers }
                });
            } catch (e) {
                throw new Error("Backendga ulanib bo'lmadi. Netlify sayt manzilini oching va DATABASE_URL sozlanganini tekshiring.");
            }
            if (response.status === 204) return null;
            const body = await response.text();
            let result = null;
            if (body) {
                try { result = JSON.parse(body) }
                catch (e) {
                const type = response.headers.get('content-type') || 'noma’lum';
                    const detail = body.replace(/\s+/g, ' ').trim().slice(0, 180);
                    throw new Error(`Netlify API JSON emas javob qaytardi (HTTP ${response.status}, ${type})${detail ? `: ${detail}` : ''}. So'nggi deploy va API routing sozlamalarini tekshiring.`);
                }
            }
            if (!response.ok) throw new Error(result?.error || `So‘rov bajarilmadi (HTTP ${response.status}).`);
            if (!result || typeof result !== 'object') throw new Error('API kutilgan JSON javobni qaytarmadi.');
            return result;
        }
        async function loadDb() { db = (await api('/api/data')).data }
        async function saveDb(update) {
            const operation = saveQueue.then(async () => {
                const next = typeof update === 'function' ? update(db) : update;
                db = (await api('/api/data', { method: 'PUT', body: JSON.stringify({ data: next }) })).data;
            });
            saveQueue = operation.catch(() => {});
            await operation;
        }
        function legacyIdentifier(method, value) {
            if (method === 'phone') {
                let digits = value.replace(/\D/g, '');
                if (digits.startsWith('998') && digits.length > 9) digits = digits.slice(3);
                return digits.length === 9 ? `p998${digits}` : null;
            }
            const email = value.trim().toLowerCase();
            return /^[^\s@]+@gmail\.com$/i.test(email) ? `m${email}` : null;
        }
        async function migrateLegacyData(method, value) {
            const oldId = legacyIdentifier(method, value);
            if (!oldId) return false;
            try {
                const oldUser = JSON.parse(ls.get('bug_session') || 'null');
                if (!oldUser || oldUser.id !== oldId || Object.values(db).some(rows => rows.length)) return false;
                const previous = JSON.parse(ls.get(`bug_db_${oldId}`) || 'null');
                if (!previous || typeof previous !== 'object') return false;
                const imported = { ...emptyDb(), ...previous };
                await saveDb(imported);
                try {
                    localStorage.removeItem(`bug_db_${oldId}`);
                    localStorage.removeItem('bug_session');
                } catch (e) { }
                return true;
            } catch (e) {
                notice = `Eski ma'lumotlarni import qilib bo'lmadi: ${e.message}`;
                return false;
            }
        }
        function showNotice(error) { notice = error.message || 'Xatolik yuz berdi.'; render() }
        function applyTheme() { const t = ls.get('bug_theme') || 'auto', r = document.documentElement; if (t === 'auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', t) }
        function ini() { return (user.name || user.label || '?').trim().charAt(0).toUpperCase() }
        function loginHTML() {
            return `<div class="login"><div class="card"><div class="logo">📒</div><h2>Buxgalter</h2><p class="s">${isStaticPages ? 'Hisob-kitoblaringiz shu brauzerda saqlanadi' : 'Hisob-kitoblaringiz barcha qurilmada'}</p>
<div class="seg"><button class="${authMode === 'login' ? 'on' : ''}" data-a="auth-mode" data-v="login">Kirish</button><button class="${authMode === 'register' ? 'on' : ''}" data-a="auth-mode" data-v="register">Ro'yxatdan o'tish</button></div>
<div class="seg"><button class="${lt === 'phone' ? 'on' : ''}" data-a="lt" data-v="phone">📱 Telefon</button><button class="${lt === 'mail' ? 'on' : ''}" data-a="lt" data-v="mail">✉️ Gmail</button></div>
${authMode === 'register' ? `<label>Ismingiz<input id="ln" type="text" maxlength="80" placeholder="Ismingiz"></label>` : ''}
${lt === 'phone' ? `<label>Telefon raqam<div class="ph"><span>+998</span><input id="lv" type="tel" inputmode="numeric" placeholder="90 123 45 67"></div></label>` : `<label>Gmail manzil<input id="lv" type="email" placeholder="ism@gmail.com"></label>`}
<label>Parol<input id="lp" type="password" minlength="8" maxlength="128" autocomplete="${authMode === 'register' ? 'new-password' : 'current-password'}" placeholder="Kamida 8 ta belgi"></label>
<p class="msg" id="err">${notice ? esc(notice) : ''}</p><button class="btn" data-a="login">${authMode === 'register' ? "Hisob yaratish" : 'Kirish'}</button><p class="s" style="margin-top:12px">${isStaticPages ? 'Ma’lumotlar ushbu qurilma va brauzerda qoladi. Parol serverda tekshirilmaydi.' : 'Ma’lumotlar serverdagi bazada saqlanadi'}</p></div></div>`}
        async function login() {
            const name = authMode === 'register' ? $('#ln').value.trim() : '', value = $('#lv').value.trim(), password = $('#lp').value, error = $('#err');
            if (authMode === 'register' && !name) { error.textContent = 'Ismingizni kiriting.'; return }
            if (password.length < 8) { error.textContent = 'Parol kamida 8 ta belgidan iborat bo‘lishi kerak.'; return }
            try {
                const result = await api(`/api/auth/${authMode}`, {
                    method: 'POST',
                    body: JSON.stringify({ method: lt, value, password, name })
                });
                user = result.user;
                await loadDb();
                notice = '';
                await migrateLegacyData(lt, value);
                view = 'purchases';
                render();
            } catch (e) {
                error.textContent = e.message;
            }
        }
        function fieldHTML(k, [n, l, ty]) {
            const c = S[k];
            if (ty === 'select') return `<label>${l}<select id="${k}_${n}">${c.opt.map(([v, t]) => `<option value="${v}">${t}</option>`).join('')}</select></label>`;
            return `<label>${l}<input id="${k}_${n}" type="${ty === 'number' ? 'number' : 'text'}" ${ty === 'number' ? 'inputmode="decimal" min="0" step="any" placeholder="0"' : ''}></label>`
        }
        function listView(k) {
            const c = S[k], rows = db[k].slice().sort((a, b) => b.d.localeCompare(a.d) || String(b.id).localeCompare(String(a.id)));
            const total = rows.reduce((s, r) => s + (k === 'extras' && r.t === 'out' ? -c.tot(r) : c.tot(r)), 0);
            return `<div class="card"><h3>${c.ic} ${c.add}</h3><div data-form="${k}">${c.f.map(f => fieldHTML(k, f)).join('')}<label>Sana<input id="${k}_d" type="date" value="${today()}"></label>
<div class="pv"><span>Jami:</span><b><span id="${k}_pv">0</span> so'm</b></div><p class="msg" id="${k}_m"></p><button class="btn" data-a="add" data-k="${k}">Qo'shish</button></div></div>
<div class="card"><h3>Ro'yxat (${rows.length})</h3>${rows.length ? rows.map(r => `<div class="row"><div><b>${esc(r.n)}</b><small>${c.sub(r)} · ${r.d}</small></div><div class="amt ${c.cls(r)}">${fmt(c.tot(r))}<button class="x" data-a="del" data-k="${k}" data-id="${r.id}">✕</button></div></div>`).join('') : '<p class="mu">Hali yozuv yo\'q</p>'}
<div class="total"><span>${c.sum}</span><b>${fmt(total)} so'm</b></div></div>`
        }
        function readForm(k) { const o = {}; S[k].f.forEach(([n, , ty]) => { const v = $(`#${k}_${n}`).value; o[n] = ty === 'number' ? (parseFloat(String(v).replace(',', '.')) || 0) : v }); o.d = $(`#${k}_d`).value || today(); return o }
        function updatePv(k) { const el = $(`#${k}_pv`); if (el) el.textContent = fmt(S[k].tot(readForm(k))) }
        async function add(k) {
            const o = readForm(k), c = S[k];
            if (c.f.some(([n, , ty]) => ty === 'number' ? !(o[n] > 0) : ty === 'text' ? !o[n].trim() : false)) { $(`#${k}_m`).textContent = `Barcha maydonlarni to'g'ri to'ldiring`; return }
            o.n = o.n.trim(); o.id = crypto.randomUUID();
            try { await saveDb(current => ({ ...current, [k]: [...current[k], o] })); notice = ''; render() }
            catch (e) { $(`#${k}_m`).textContent = e.message }
        }
        function calc(fn) {
            const t = (k, f) => db[k].filter(r => fn(r.d) && (!f || f(r))).reduce((s, r) => s + S[k].tot(r), 0);
            const sales = t('sales'), exin = t('extras', r => r.t === 'in'), pur = t('purchases'), wag = t('workers'), exout = t('extras', r => r.t === 'out'), kirim = sales + exin, chiqim = pur + wag + exout;
            return { sales, exin, pur, wag, exout, kirim, chiqim, foyda: kirim - chiqim }
        }
        function sumView() {
            const d = sm.mode === 'd', fn = d ? x => x === sm.day : x => x.startsWith(sm.month), r = calc(fn);
            let tb = ''; if (!d) {
                const ds = new Set(); Object.keys(S).forEach(k => db[k].forEach(x => { if (x.d.startsWith(sm.month)) ds.add(x.d) }));
                tb = [...ds].sort().reverse().map(x => { const q = calc(y => y === x); return `<tr><td>${x.slice(8)}</td><td class="ok">${fmt(q.kirim)}</td><td class="bad">${fmt(q.chiqim)}</td><td class="${q.foyda >= 0 ? 'ok' : 'bad'}">${fmt(q.foyda)}</td></tr>` }).join('')
            }
            const L = (a, b, c) => `<div class="row"><span>${a}</span><b class="${c || ''}">${fmt(b)} so'm</b></div>`;
            return `<div class="seg"><button class="${d ? 'on' : ''}" data-a="mode" data-v="d">Kunlik</button><button class="${d ? '' : 'on'}" data-a="mode" data-v="m">Oylik</button></div>
<div class="card"><label>${d ? 'Sana' : 'Oy'}<input type="${d ? 'date' : 'month'}" data-sm="${d ? 'day' : 'month'}" value="${d ? sm.day : sm.month}"></label></div>
<div class="kp"><div class="k k1"><small>Kirim</small><b>${fmt(r.kirim)}</b></div><div class="k k2"><small>Chiqim</small><b>${fmt(r.chiqim)}</b></div><div class="k k3"><small>${r.foyda >= 0 ? 'Sof foyda' : 'Zarar'}</small><b>${fmt(r.foyda)} so'm</b></div></div>
<div class="card"><h3>Kirim</h3>${L('Sotilgan mahsulotlar', r.sales, 'ok')}${L(`Qo'shimcha kirim`, r.exin, 'ok')}<h3 style="margin-top:14px">Chiqim</h3>${L('Olingan mahsulotlar', r.pur, 'bad')}${L('Ishchilar haqi', r.wag, 'bad')}${L(`Qo'shimcha chiqim`, r.exout, 'bad')}</div>
${d ? '' : `<div class="card"><h3>Kunlar bo'yicha</h3><div class="tw"><table><tr><th>Kun</th><th>Kirim</th><th>Chiqim</th><th>Foyda</th></tr>${tb || '<tr><td colspan="4">Yozuv yo\'q</td></tr>'}</table></div></div>`}`
        }
        function profView() {
            return `<div class="card prof"><div class="av">${esc(ini())}</div><h3>${esc(user.name)}</h3><p class="mu">${esc(user.label)}</p></div>
<div class="card"><label>Ismni o'zgartirish<input id="pn" type="text" value="${esc(user.name)}"></label><button class="btn" data-a="name">Saqlash</button></div>
<div class="card"><button class="btn sec" data-a="logout">Chiqish</button></div>`}
        function setView() {
            const t = ls.get('bug_theme') || 'auto';
            return `<div class="card"><h3>🎨 Ko'rinish</h3><div class="seg">${[['auto', 'Avto'], ['light', 'Yorug'], ['dark', 'Qorong\'i']].map(([v, l]) => `<button class="${t === v ? 'on' : ''}" data-a="theme" data-v="${v}">${l}</button>`).join('')}</div></div>
<div class="card"><h3>🗑 Ma'lumotlar</h3><p class="mu" style="text-align:left">Barcha yozuvlar (olingan, sotilgan, ishchilar, qo'shimcha) o'chiriladi.</p><button class="btn red" data-a="wipe">${wipe ? 'Yana bosing — tasdiqlash' : 'Hammasini o\'chirish'}</button></div>
<div class="card"><h3>ℹ️ Ilova haqida</h3><p class="mu" style="text-align:left">Buxgalter · valyuta: so'm. ${isStaticPages ? 'Ma’lumotlar faqat shu brauzerda saqlanadi.' : 'Ma’lumotlar hisobingiz bilan serverda saqlanadi.'}</p></div>`}
        function render() {
            const A = $('#app'); if (!user) { A.innerHTML = loginHTML(); return }
            const b = S[view] ? listView(view) : view === 'summary' ? sumView() : view === 'profile' ? profView() : setView();
            A.innerHTML = `<header><h1>${T[view]}</h1><div><button class="ib" data-a="nav" data-v="settings">⚙️</button><button class="av" data-a="nav" data-v="profile">${esc(ini())}</button></div></header><main>${notice ? `<p class="msg">${esc(notice)}</p>` : ''}${b}</main><nav><div>${N.map(([v, i, l]) => `<button class="${view === v ? 'on' : ''}" data-a="nav" data-v="${v}"><span>${i}</span>${l}</button>`).join('')}</div></nav>`
        }
        async function removeRecord(k, id) {
            try {
                await saveDb(current => ({ ...current, [k]: current[k].filter(r => String(r.id) !== id) }));
                notice = '';
                render();
            } catch (e) { showNotice(e) }
        }
        async function logout() {
            try {
                await api('/api/auth/logout', { method: 'POST' });
                user = null; db = null; wipe = false; notice = ''; render();
            } catch (e) { showNotice(e) }
        }
        async function wipeData() {
            if (!wipe) { wipe = true; render(); return }
            try {
                await saveDb(() => emptyDb());
                wipe = false; notice = ''; render();
            } catch (e) { showNotice(e) }
        }
        async function saveProfile() {
            const name = $('#pn').value.trim();
            if (!name) { notice = 'Ismingizni kiriting.'; render(); return }
            try {
                user = (await api('/api/profile', { method: 'PATCH', body: JSON.stringify({ name }) })).user;
                notice = ''; render();
            } catch (e) { showNotice(e) }
        }
        async function initialize() {
            try {
                const result = await api('/api/session');
                user = result.user;
                if (user) await loadDb();
                notice = '';
            } catch (e) {
                user = null;
                notice = `Serverga ulanib bo‘lmadi: ${e.message}`;
            }
            render();
        }
        document.addEventListener('click', e => {
            const b = e.target.closest('[data-a]'); if (!b) return; const a = b.dataset.a, d = b.dataset;
            if (a === 'nav') { view = d.v; wipe = false; render(); window.scrollTo(0, 0) }
            else if (a === 'lt') { lt = d.v; render() }
            else if (a === 'auth-mode') { authMode = d.v; notice = ''; render() }
            else if (a === 'login') login();
            else if (a === 'add') add(d.k);
            else if (a === 'del') removeRecord(d.k, d.id);
            else if (a === 'mode') { sm.mode = d.v; render() }
            else if (a === 'logout') logout();
            else if (a === 'wipe') wipeData();
            else if (a === 'theme') { ls.set('bug_theme', d.v); applyTheme(); render() }
            else if (a === 'name') saveProfile();
        });
        document.addEventListener('input', e => { const f = e.target.closest('[data-form]'); if (f) updatePv(f.dataset.form) });
        document.addEventListener('change', e => {
            const s = e.target.dataset && e.target.dataset.sm; if (s && e.target.value) { sm[s] = e.target.value; render() }
            const f = e.target.closest('[data-form]'); if (f) updatePv(f.dataset.form)
        });
        applyTheme();
        initialize();
    </script>
</body>

</html>
